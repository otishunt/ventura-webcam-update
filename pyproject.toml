[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memepose"
version = "0.1.0"
description = "DATA 4620: meme pose recognition with synthetic domain randomization"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["memepose*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
